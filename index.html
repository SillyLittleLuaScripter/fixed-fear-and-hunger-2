        <script>
            (function () {
  const toLower = url => {
    try {
      const u = new URL(url, location.href);
      u.pathname = u.pathname.toLowerCase();
      return u.toString();
    } catch {
      return url.toLowerCase();
    }
  };

  const origFetch = window.fetch;
  window.fetch = function (input, init) {
    if (typeof input === "string") input = toLower(input);
    else if (input instanceof Request) input = new Request(toLower(input.url), input);
    return origFetch.call(this, input, init);
  };

  const origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url, ...rest) {
    return origOpen.call(this, method, toLower(url), ...rest);
  };

  const origCreateElement = document.createElement.bind(document);
  document.createElement = function (tag, ...args) {
    const el = origCreateElement(tag, ...args);
    const tagLower = tag.toLowerCase();

    if (["img", "script", "link", "audio", "video", "source", "iframe", "embed"].includes(tagLower)) {
      const attr = tagLower === "link" ? "href" : "src";
      const descriptor = Object.getOwnPropertyDescriptor(el.__proto__, attr) ||
                         Object.getOwnPropertyDescriptor(HTMLElement.prototype, attr);

      if (descriptor) {
        Object.defineProperty(el, attr, {
          get() { return descriptor.get.call(this); },
          set(val) { descriptor.set.call(this, toLower(val)); },
          configurable: true
        });
      }
    }

    return el;
  };

  const observer = new MutationObserver(mutations => {
    for (const mutation of mutations) {
      for (const node of mutation.addedNodes) {
        if (!(node instanceof HTMLElement)) continue;
        const all = [node, ...node.querySelectorAll("[src],[href]")];
        for (const el of all) {
          if (el.src) el.src = toLower(el.src);
          if (el.href && !(el instanceof HTMLAnchorElement)) el.href = toLower(el.href);
        }
      }
    }
  });

  observer.observe(document.documentElement, { childList: true, subtree: true });

  const origWorker = window.Worker;
  window.Worker = function (url, opts) {
    return new origWorker(toLower(url), opts);
  };

  if (window.EventSource) {
    const origES = window.EventSource;
    window.EventSource = function (url, opts) {
      return new origES(toLower(url), opts);
    };
  }

  if (window.WebSocket) {
    const origWS = window.WebSocket;
    window.WebSocket = function (url, protocols) {
      return new origWS(toLower(url), protocols);
    };
  }
})();
        </script>

 <!-- mobile + canvas patch -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
<script>
(function () {
  // ---- scale canvas safely (no null crash) ----
  function applycanvasmode() {
    var canvas = document.querySelector("#GameCanvas");
    var video = document.querySelector("#GameVideo");
    var upper = document.querySelector("#UpperCanvas");
    if (!canvas) return;
    var maxW = window.innerWidth, maxH = window.innerHeight, w, h;
    if (maxW * 0.75 > maxH) { h = maxH; w = Math.floor((maxH / 3) * 4); }
    else { w = maxW; h = Math.floor((maxW / 4) * 3); }
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    if (video) { video.style.width = w + "px"; video.style.height = h + "px"; }
    if (upper) { upper.style.width = w + "px"; upper.style.height = h + "px"; }
  }
  setInterval(applycanvasmode, 200);
  window.addEventListener("resize", applycanvasmode);

  // ---- fake keyboard for RPG Maker ----
  function ensureInput() {
    if (typeof Input === "undefined" || !Input._currentState) return null;
    return Input;
  }
  var fakeInput = {
    down: function (key) {
      var I = ensureInput();
      if (I) I._currentState[key] = true;
    },
    up: function (key) {
      var I = ensureInput();
      if (I) I._currentState[key] = false;
    }
  };

  function isTouch() {
    return "ontouchstart" in window || navigator.maxTouchPoints > 0 ||
      /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  }
  if (!isTouch()) return;

  // prevent page scroll
  document.addEventListener("touchmove", function (e) {
    if (e.target.closest && (e.target.closest("#nipple-zone") || e.target.closest(".mv-btn")))
      e.preventDefault();
  }, { passive: false });

  // ---- joystick ----
  var zone = document.createElement("div");
  zone.id = "nipple-zone";
  zone.style.cssText = "position:fixed;left:0;bottom:0;width:45vw;height:40vh;z-index:999999;touch-action:none;";
  document.body.appendChild(zone);

  function bootStick() {
    if (typeof nipplejs === "undefined") return setTimeout(bootStick, 100);
    var stick = nipplejs.create({
      zone: zone,
      mode: "static",
      position: { left: "22vw", bottom: "18vh" },
      size: Math.min(window.innerWidth, window.innerHeight) * 0.22,
      color: "white"
    });
    var dirs = ["up", "down", "left", "right"];
    stick.on("move", function (evt, data) {
      if (!data || !data.direction) return;
      var ang = data.direction.angle; // 'up','down','left','right'
      dirs.forEach(function (d) {
        if (d === ang) fakeInput.down(d);
        else fakeInput.up(d);
      });
    });
    stick.on("end", function () {
      dirs.forEach(function (d) { fakeInput.up(d); });
    });
  }
  bootStick();

  // ---- buttons ----
  function btn(label, key, bottom, right, color) {
    var b = document.createElement("div");
    b.className = "mv-btn";
    b.textContent = label;
    b.style.cssText =
      "position:fixed;bottom:" + bottom + ";right:" + right +
      ";width:12vw;height:12vw;max-width:64px;max-height:64px;" +
      "background:" + color + ";color:#fff;border-radius:50%;" +
      "display:flex;align-items:center;justify-content:center;" +
      "font:600 3.5vw sans-serif;z-index:999999;touch-action:none;user-select:none;";
    function down(e) { e.preventDefault(); fakeInput.down(key); }
    function up(e) { e.preventDefault(); fakeInput.up(key); }
    b.addEventListener("touchstart", down, { passive: false });
    b.addEventListener("touchend", up, { passive: false });
    b.addEventListener("touchcancel", up, { passive: false });
    document.body.appendChild(b);
  }
  btn("OK", "ok", "4vh", "4vw", "rgba(0,180,0,0.55)");
  btn("ESC", "escape", "4vh", "18vw", "rgba(200,0,0,0.55)");
  btn("TAG", "tag", "16vh", "18vw", "rgba(0,80,220,0.55)");
  btn("RUN", "shift", "16vh", "4vw", "rgba(180,0,180,0.55)");

  // ---- fullscreen ----
  var fs = document.createElement("div");
  fs.className = "mv-btn";
  fs.textContent = "FS";
  fs.style.cssText =
    "position:fixed;top:2vh;right:2vw;width:10vw;height:10vw;max-width:48px;max-height:48px;" +
    "background:rgba(255,255,255,0.25);color:#fff;border-radius:50%;" +
    "display:flex;align-items:center;justify-content:center;font:600 3vw sans-serif;z-index:999999;";
  fs.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
  }, { passive: false });
  document.body.appendChild(fs);
})();
</script>
